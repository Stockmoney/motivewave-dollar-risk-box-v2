MENU_GENERAL=Alex Indicators
STUDY_NAME=Dollar Risk Box V2
STUDY_DESC=Risk box as in Futures Tester: press Risk box (or R over the chart), click entry, stop and target - the side follows the stop. Contracts from a $ or % risk at an honest 1R (stop + slippage + both commissions), at least 1 and at most a limit; target net of commissions; R:R by ticks. Display only - never sends orders.

